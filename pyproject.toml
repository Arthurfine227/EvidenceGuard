[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencepilot"
version = "0.1.0"
description = "An auditable agent for multimodal claim verification"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
benchmark = ["agentdojo==0.1.35"]

[project.scripts]
evidencepilot = "evidencepilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

